name: Configure GitHub Pages source

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write

# If GITHUB_TOKEN cannot configure Pages, add a personal access token
# secret named PAGES_PAT with repo + pages:write scopes.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  set-pages-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages to use gh-pages branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAGES_PAT || github.token }}
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              source: { branch: 'gh-pages', path: '/' },
            };

            try {
              const response = await github.request('PUT /repos/{owner}/{repo}/pages', params);
              core.info(`GitHub Pages source set: ${response.data.source.branch}/${response.data.source.path}`);
            } catch (error) {
              if (error.status === 404) {
                const response = await github.request('POST /repos/{owner}/{repo}/pages', params);
                core.info(`GitHub Pages source created: ${response.data.source.branch}/${response.data.source.path}`);
              } else {
                throw error;
              }
            }
