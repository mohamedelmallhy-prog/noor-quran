name: Configure GitHub Pages source

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write

jobs:
  set-pages-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages to use gh-pages branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.repos.createPagesSite({
              owner: context.repo.owner,
              repo: context.repo.repo,
              source: { branch: 'gh-pages', path: '/' },
            });
            core.info(`GitHub Pages source set: ${response.data.source.branch}/${response.data.source.path}`);
