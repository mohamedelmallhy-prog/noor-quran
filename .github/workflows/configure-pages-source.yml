name: Configure GitHub Pages source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  set-pages-source:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PAGES_PAT secret
        run: |
          if [ -z "${{ secrets.PAGES_PAT }}" ]; then
            echo "ERROR: PAGES_PAT secret is unset or empty"
            exit 1
          fi

      - name: Configure GitHub Pages to use gh-pages branch
        run: |
          set -euo pipefail

          if [ -z "${GITHUB_REPOSITORY:-}" ]; then
            echo "ERROR: GITHUB_REPOSITORY is not set"
            exit 1
          fi

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          token="${{ secrets.PAGES_PAT }}"
          payload='{"source":{"branch":"gh-pages","path":"/"}}'
          out=/tmp/pages.json

          status=$(curl -sS -w "%{http_code}" -o "$out" -X PUT \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.github.com/repos/${owner}/${repo}/pages")

          if [ "$status" = "404" ]; then
            echo "Pages site not found, creating it..."
            status=$(curl -sS -w "%{http_code}" -o "$out" -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "https://api.github.com/repos/${owner}/${repo}/pages")
          fi

          echo "GitHub Pages API status: $status"

          if [ "$status" = "204" ]; then
            echo "GitHub Pages source configured successfully (204 No Content)."
            exit 0
          fi

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "GitHub Pages configuration API call failed with status $status"
            cat "$out" || true
            exit 1
          fi

          if [ -s "$out" ]; then
            python3 - <<'PY'
            import json
            from pathlib import Path
            path = Path('/tmp/pages.json')
            try:
                data = json.loads(path.read_text())
                source = data.get('source', {}) if isinstance(data, dict) else {}
                branch = source.get('branch') if isinstance(source, dict) else None
                path_val = source.get('path') if isinstance(source, dict) else None
                if branch or path_val:
                    print(f'GitHub Pages source configured: {branch or "<unknown>"}{path_val or ""}')
                else:
                    print('GitHub Pages source configured, but response did not include source metadata.')
            except Exception as exc:
                print(f'Response parsed, but JSON parse failed: {exc}')
                print(path.read_text())
            PY
          else
            echo "GitHub Pages source configured successfully with an empty response body."
          fi
