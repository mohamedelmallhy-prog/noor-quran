name: Configure GitHub Pages source

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write

# This workflow must use PAGES_PAT for GitHub Pages source configuration.
# Add a secret named PAGES_PAT with repo + pages:write scopes.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  set-pages-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PAGES_PAT secret
        run: |
          if [ -z "${{ secrets.PAGES_PAT }}" ]; then
            echo "ERROR: PAGES_PAT secret is unset or empty"
            exit 1
          fi

      - name: Configure GitHub Pages to use gh-pages branch
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1)
          repo=$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)
          token="${{ secrets.PAGES_PAT }}"
          payload='{"source":{"branch":"gh-pages","path":"/"}}'

          response=$(curl -sS -w "%{http_code}" -o /tmp/pages.json -X PUT \
            -H "Authorization: token ${token}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            "https://api.github.com/repos/${owner}/${repo}/pages")

          if [ "$response" = "404" ]; then
            echo "Pages site not found, creating it..."
            response=$(curl -sS -w "%{http_code}" -o /tmp/pages.json -X POST \
              -H "Authorization: token ${token}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "${payload}" \
              "https://api.github.com/repos/${owner}/${repo}/pages")
          fi

          if [ "$response" = "204" ]; then
            echo "GitHub Pages source configured successfully (204 No Content)."
            exit 0
          fi

          if [ "$response" != "200" ] && [ "$response" != "201" ]; then
            echo "GitHub Pages configuration API call failed with status $response"
            cat /tmp/pages.json
            exit 1
          fi

          if [ -s /tmp/pages.json ]; then
            python - <<'PY'
import json
from pathlib import Path
path = Path('/tmp/pages.json')
try:
    data = json.loads(path.read_text())
    source = data.get('source') or {}
    branch = source.get('branch', '<unknown>')
    path_val = source.get('path', '<unknown>')
    print(f'GitHub Pages source configured: {branch}{path_val}')
except Exception as e:
    print(f'GitHub Pages source configured; response JSON could not be parsed: {e}')
PY
          else
            echo "GitHub Pages source configured successfully."
          fi
